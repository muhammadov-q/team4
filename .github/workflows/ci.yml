# Runs each area's check.sh, the same gate the pre-push hook runs. Like the
# hook, an area without a check.sh yet is skipped, so backend and mobile join
# by adding one (plus their toolchain setup here).

name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: hashFiles('frontend/check.sh') != ''
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint, format, type check, unit tests
        if: hashFiles('frontend/check.sh') != ''
        working-directory: frontend
        run: bash check.sh
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        if: hashFiles('backend/check.sh') != ''
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        if: hashFiles('backend/check.sh') != ''
        with:
          node-version-file: .nvmrc
      - name: Lint, format, type check, pytest, Bruno API tests
        if: hashFiles('backend/check.sh') != ''
        working-directory: backend
        run: bash check.sh

  mobile:
    name: Mobile KMP tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests and debug build
        run: bash check.sh

  docs:
    name: Docs checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Broken links, line numbers, stale paths
        if: hashFiles('docs/check.sh') != ''
        working-directory: docs
        run: bash check.sh
